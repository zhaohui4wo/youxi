<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="给小朋友的打字小游戏：字母、单词、拼音三种模式">
<title>字母大冒险 🚀 打字小游戏</title>
<link rel="stylesheet" href="style.css?v=20261109-3">
</head>
<body>
<div id="app">

  <!-- 开始/结束界面的背景装饰 -->
  <div id="bg-deco" aria-hidden="true">
    <span class="cloud cloud-1"></span>
    <span class="cloud cloud-2"></span>
    <span class="cloud cloud-3"></span>
    <span class="balloon balloon-1">🎈</span>
    <span class="balloon balloon-2">🎈</span>
    <span class="sparkle sparkle-1">✨</span>
    <span class="sparkle sparkle-2">⭐</span>
    <span class="sparkle sparkle-3">✨</span>
  </div>

  <!-- 开始界面 -->
  <section id="screen-start" class="screen">
    <div class="panel">
      <div class="pony-duo">
      <!-- 左右两侧的卡通小马伙伴（原创简笔 SVG 插画） -->
      <div class="pony pony-left pony-fluttershy" aria-hidden="true">
        <svg class="pony-svg" viewBox="0 0 210 192">
          <defs>
            <linearGradient id="fsMane" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffd8e7"/>
              <stop offset="0.5" stop-color="#f9a8c9"/>
              <stop offset="1" stop-color="#ef7fb2"/>
            </linearGradient>
            <linearGradient id="fsTail" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f9a8c9"/>
              <stop offset="1" stop-color="#ffd8e7"/>
            </linearGradient>
          </defs>
          <path class="mane2" fill="url(#fsTail)" d="M178 98 Q204 118 190 140 Q202 154 184 164 Q166 174 158 156 Q168 148 166 134 Q176 122 170 106 Z"/>
          <rect class="coat" x="150" y="148" width="15" height="40" rx="7"/>
          <rect class="coat" x="168" y="144" width="15" height="44" rx="7"/>
          <rect class="coat" x="94" y="150" width="14" height="38" rx="7"/>
          <rect class="coat" x="112" y="152" width="14" height="36" rx="7"/>
          <ellipse class="coat" cx="130" cy="128" rx="56" ry="40"/>
          <path class="wing" d="M124 108 Q104 78 124 62 Q136 52 146 60 Q134 66 132 78 Q144 70 152 78 Q140 84 138 96 Q148 94 154 100 Q142 106 136 116 Z"/>
          <circle class="coat" cx="72" cy="78" r="32"/>
          <ellipse class="coat-light" cx="96" cy="90" rx="16" ry="12"/>
          <ellipse class="eye-white" cx="80" cy="75" rx="9" ry="11"/>
          <ellipse class="iris" cx="84" cy="78" rx="5.5" ry="6"/>
          <circle class="pupil" cx="85" cy="80" r="2.5"/>
          <circle class="eye-glint" cx="87" cy="73.5" r="2.2"/>
          <circle class="eye-glint" cx="82" cy="84" r="1.1"/>
          <circle class="dot" cx="100" cy="88" r="1.6"/>
          <path class="smile" d="M94 96 Q99 100 105 93"/>
          <ellipse class="blush" cx="60" cy="92" rx="5.5" ry="3.2"/>
          <g class="mark">
            <g transform="translate(130 121) rotate(-15)">
              <circle cx="-2.6" cy="-1.4" r="2.5"/>
              <circle cx="2.6" cy="-1.4" r="2.5"/>
              <circle cx="0" cy="1.2" r="2.9"/>
              <circle class="mark2" cx="0" cy="0" r="0.9"/>
            </g>
            <g transform="translate(145 115) rotate(10)">
              <circle cx="-2.2" cy="-1.2" r="2.1"/>
              <circle cx="2.2" cy="-1.2" r="2.1"/>
              <circle cx="0" cy="1" r="2.4"/>
              <circle class="mark2" cx="0" cy="0" r="0.8"/>
            </g>
            <g transform="translate(138 134) rotate(22)">
              <circle cx="-2.2" cy="-1.2" r="2.1"/>
              <circle cx="2.2" cy="-1.2" r="2.1"/>
              <circle cx="0" cy="1" r="2.4"/>
              <circle class="mark2" cx="0" cy="0" r="0.8"/>
            </g>
          </g>
          <path class="mane" fill="url(#fsMane)" d="M42 70 Q40 34 76 30 Q104 34 108 52 Q94 64 80 54 Q64 70 42 70 Z"/>
          <path class="mane2" fill="url(#fsTail)" d="M52 66 Q34 94 50 116 Q64 106 58 84 Q62 72 52 66 Z"/>
          <path class="coat" d="M58 52 Q50 30 66 28 Q80 30 82 52 Q70 44 58 52 Z"/>
          <path class="ear-inner" d="M62 47 Q58 36 66 34 Q73 36 75 47 Q68 42 62 47 Z"/>
        </svg>
        <span class="pony-name">柔柔</span>
      </div>

      <div class="pony pony-right pony-twilight" aria-hidden="true">
        <svg class="pony-svg" viewBox="0 0 210 192">
          <defs>
            <linearGradient id="twMane" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3f3468"/>
              <stop offset="0.45" stop-color="#6b4fa8"/>
              <stop offset="0.75" stop-color="#a55fd4"/>
              <stop offset="1" stop-color="#ef8fb2"/>
            </linearGradient>
            <linearGradient id="twTail" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a3a80"/>
              <stop offset="0.6" stop-color="#8b5cc4"/>
              <stop offset="1" stop-color="#ef8fb2"/>
            </linearGradient>
          </defs>
          <path class="mane2" fill="url(#twTail)" d="M178 98 Q204 118 190 140 Q202 154 184 164 Q166 174 158 156 Q168 148 166 134 Q176 122 170 106 Z"/>
          <rect class="coat" x="150" y="148" width="15" height="40" rx="7"/>
          <rect class="coat" x="168" y="144" width="15" height="44" rx="7"/>
          <rect class="coat" x="94" y="150" width="14" height="38" rx="7"/>
          <rect class="coat" x="112" y="152" width="14" height="36" rx="7"/>
          <ellipse class="coat" cx="130" cy="128" rx="56" ry="40"/>
          <path class="wing" d="M124 108 Q104 78 124 62 Q136 52 146 60 Q134 66 132 78 Q144 70 152 78 Q140 84 138 96 Q148 94 154 100 Q142 106 136 116 Z"/>
          <circle class="coat" cx="72" cy="78" r="32"/>
          <ellipse class="coat-light" cx="96" cy="90" rx="16" ry="12"/>
          <path class="coat horn" d="M78 48 Q80 24 96 4 Q104 8 86 48 Z"/>
          <ellipse class="eye-white" cx="80" cy="75" rx="9" ry="11"/>
          <ellipse class="iris" cx="84" cy="78" rx="5.5" ry="6"/>
          <circle class="pupil" cx="85" cy="80" r="2.5"/>
          <circle class="eye-glint" cx="87" cy="73.5" r="2.2"/>
          <circle class="eye-glint" cx="82" cy="84" r="1.1"/>
          <circle class="dot" cx="100" cy="88" r="1.6"/>
          <path class="smile" d="M94 96 Q99 100 105 93"/>
          <ellipse class="blush" cx="60" cy="92" rx="5.5" ry="3.2"/>
          <g class="mark" transform="translate(138 126)">
            <path d="M0 -9 L1.9 -3.3 L7.8 -4.5 L3.8 0 L7.8 4.5 L1.9 3.3 L0 9 L-1.9 3.3 L-7.8 4.5 L-3.8 0 L-7.8 -4.5 L-1.9 -3.3 Z"/>
          </g>
          <path class="mark2" d="M152 112 L153 115.4 L156.4 116.4 L153 117.4 L152 120.8 L151 117.4 L147.6 116.4 L151 115.4 Z"/>
          <path class="mark2" d="M125 141 L125.8 143.2 L128 144 L125.8 144.8 L125 147 L124.2 144.8 L122 144 L124.2 143.2 Z"/>
          <path class="mane" fill="url(#twMane)" d="M42 70 Q40 34 76 30 Q104 34 108 52 Q94 64 80 54 Q64 70 42 70 Z"/>
          <path class="mane2" fill="url(#twTail)" d="M52 66 Q34 94 50 116 Q64 106 58 84 Q62 72 52 66 Z"/>
          <path class="coat" d="M58 52 Q50 30 66 28 Q80 30 82 52 Q70 44 58 52 Z"/>
          <path class="ear-inner" d="M62 47 Q58 36 66 34 Q73 36 75 47 Q68 42 62 47 Z"/>
        </svg>
        <span class="pony-name">紫悦</span>
      </div>
      </div>


      <h1 class="title">🚀 字母大冒险</h1>
      <p class="subtitle">选一个模式，开始打字吧！</p>
      <div class="speed-row">
        <span class="speed-label">速度</span>
        <div class="speed-opts">
          <button class="speed-btn" data-speed="slow">🐢 慢慢来</button>
          <button class="speed-btn" data-speed="normal">🐰 正合适</button>
          <button class="speed-btn" data-speed="fast">🦊 有点快</button>
        </div>
      </div>
      <div class="mode-list">
        <button class="mode-btn letter" data-mode="letter">
          <span class="mode-emoji">🔤</span>
          <span>
            <span class="mode-name">字母模式</span>
            <span class="mode-desc">单个字母掉下来，按对应的键把它打掉</span>
          </span>
          <span class="mode-best" data-best="letter">🏆 最高分 0</span>
        </button>
        <button class="mode-btn word" data-mode="word">
          <span class="mode-emoji">🐱</span>
          <span>
            <span class="mode-name">单词模式</span>
            <span class="mode-desc">拼出完整的英文单词，卡片上还有中文意思</span>
          </span>
          <span class="mode-best" data-best="word">🏆 最高分 0</span>
        </button>
        <button class="mode-btn pinyin" data-mode="pinyin">
          <span class="mode-emoji">🀄</span>
          <span>
            <span class="mode-name">拼音模式</span>
            <span class="mode-desc">看到汉字，敲出它的拼音（不用声调）</span>
          </span>
          <span class="mode-best" data-best="pinyin">🏆 最高分 0</span>
        </button>
      </div>
      <p class="hint">⌨️ 用键盘打字 · 游戏中也可以点击下方虚拟键盘 · 按 <b>空格键</b> 暂停</p>
      <p class="credit">出品人：纳米</p>
    </div>
  </section>

  <!-- 游戏界面 -->
  <section id="screen-game" class="screen hidden">
    <div id="hud">
      <button id="btn-home" class="hud-btn" title="回到首页">🏠</button>
      <div class="hud-chip" id="chip-score">🏅 <span id="score">0</span></div>
      <div class="hud-chip" id="chip-level">⭐ 第 <span id="level">1</span> 关</div>
      <div class="hud-chip combo hidden" id="chip-combo">🔥 连击 <span id="combo">0</span></div>
      <div id="lives">❤️❤️❤️</div>
      <div class="hud-spacer"></div>
      <button id="btn-pause" class="hud-btn" title="暂停 (空格)">⏸️</button>
      <button id="btn-mute" class="hud-btn" title="开/关声音">🔊</button>
    </div>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="pause-overlay" class="overlay hidden">
        <div class="panel">
          <p class="overlay-title">⏸️ 休息一下</p>
          <button id="btn-resume" class="big-btn">▶️ 继续游戏</button>
          <button id="btn-quit" class="big-btn ghost">🏠 回到首页</button>
        </div>
      </div>
    </div>

    <!-- 底部虚拟键盘 + 手指指导 -->
    <div id="keyboard-panel" role="group" aria-label="虚拟键盘和手指指导">
      <div class="hand hand-left" aria-hidden="true">
        <svg class="hand-svg" viewBox="0 0 120 130">
          <path class="palm" d="M30 58 Q30 46 44 46 H84 Q98 46 98 60 V94 Q98 114 78 114 H48 Q30 114 30 94 Z"/>
          <rect class="finger thumb" data-finger="l-thumb" x="4" y="70" width="36" height="17" rx="8.5" transform="rotate(-30 22 78)"/>
          <rect class="finger index" data-finger="l-index" x="24" y="26" width="16" height="50" rx="8"/>
          <rect class="finger middle" data-finger="l-middle" x="44" y="18" width="16" height="58" rx="8"/>
          <rect class="finger ring" data-finger="l-ring" x="64" y="24" width="16" height="52" rx="8"/>
          <rect class="finger pinky" data-finger="l-pinky" x="84" y="36" width="14" height="40" rx="7"/>
        </svg>
        <span class="hand-label">左手</span>
      </div>

      <div id="kb-center">
        <div id="guide-text" role="status" aria-live="polite">
          <span id="guide-dot" aria-hidden="true"></span>
          <span id="guide-label">等待卡片…</span>
          <kbd id="guide-key"></kbd>
        </div>
        <div id="keyboard">
          <div class="kb-row" data-row="1">
            <button type="button" class="kb-key" data-key="q" data-finger="l-pinky">Q</button>
            <button type="button" class="kb-key" data-key="w" data-finger="l-ring">W</button>
            <button type="button" class="kb-key" data-key="e" data-finger="l-middle">E</button>
            <button type="button" class="kb-key" data-key="r" data-finger="l-index">R</button>
            <button type="button" class="kb-key" data-key="t" data-finger="l-index">T</button>
            <button type="button" class="kb-key" data-key="y" data-finger="r-index">Y</button>
            <button type="button" class="kb-key" data-key="u" data-finger="r-index">U</button>
            <button type="button" class="kb-key" data-key="i" data-finger="r-middle">I</button>
            <button type="button" class="kb-key" data-key="o" data-finger="r-ring">O</button>
            <button type="button" class="kb-key" data-key="p" data-finger="r-pinky">P</button>
          </div>
          <div class="kb-row" data-row="2">
            <button type="button" class="kb-key" data-key="a" data-finger="l-pinky">A</button>
            <button type="button" class="kb-key" data-key="s" data-finger="l-ring">S</button>
            <button type="button" class="kb-key" data-key="d" data-finger="l-middle">D</button>
            <button type="button" class="kb-key" data-key="f" data-finger="l-index">F</button>
            <button type="button" class="kb-key" data-key="g" data-finger="l-index">G</button>
            <button type="button" class="kb-key" data-key="h" data-finger="r-index">H</button>
            <button type="button" class="kb-key" data-key="j" data-finger="r-index">J</button>
            <button type="button" class="kb-key" data-key="k" data-finger="r-middle">K</button>
            <button type="button" class="kb-key" data-key="l" data-finger="r-ring">L</button>
          </div>
          <div class="kb-row" data-row="3">
            <button type="button" class="kb-key" data-key="z" data-finger="l-pinky">Z</button>
            <button type="button" class="kb-key" data-key="x" data-finger="l-ring">X</button>
            <button type="button" class="kb-key" data-key="c" data-finger="l-middle">C</button>
            <button type="button" class="kb-key" data-key="v" data-finger="l-index">V</button>
            <button type="button" class="kb-key" data-key="b" data-finger="l-index">B</button>
            <button type="button" class="kb-key" data-key="n" data-finger="r-index">N</button>
            <button type="button" class="kb-key" data-key="m" data-finger="r-index">M</button>
          </div>
        </div>
      </div>

      <div class="hand hand-right" aria-hidden="true">
        <svg class="hand-svg" viewBox="0 0 120 130">
          <path class="palm" d="M30 58 Q30 46 44 46 H84 Q98 46 98 60 V94 Q98 114 78 114 H48 Q30 114 30 94 Z"/>
          <rect class="finger thumb" data-finger="r-thumb" x="4" y="70" width="36" height="17" rx="8.5" transform="rotate(-30 22 78)"/>
          <rect class="finger index" data-finger="r-index" x="24" y="26" width="16" height="50" rx="8"/>
          <rect class="finger middle" data-finger="r-middle" x="44" y="18" width="16" height="58" rx="8"/>
          <rect class="finger ring" data-finger="r-ring" x="64" y="24" width="16" height="52" rx="8"/>
          <rect class="finger pinky" data-finger="r-pinky" x="84" y="36" width="14" height="40" rx="7"/>
        </svg>
        <span class="hand-label">右手</span>
      </div>
    </div>
  </section>

  <!-- 结束界面 -->
  <section id="screen-over" class="screen hidden">
    <div class="panel">
      <p class="over-title" id="over-title">🎉 真棒！</p>
      <p class="over-score"><span id="over-score">0</span> 分</p>
      <p class="over-newbest hidden" id="over-newbest">🏆 新纪录！</p>
      <p class="over-stats" id="over-stats">最高连击 0 · 闯到第 1 关</p>
      <p class="over-best" id="over-best">最高分：0</p>
      <div class="over-btns">
        <button id="btn-retry" class="big-btn">🔄 再来一次</button>
        <button id="btn-menu" class="big-btn ghost">🏠 选其他模式</button>
      </div>
    </div>
  </section>

  <!-- 升级全屏庆祝动画 -->
  <div id="level-fx" aria-hidden="true"></div>

</div>
<script src="game.js?v=20261108-2"></script>
</body>
</html>
